[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escalation-contract"
version = "0.1.0"
description = "A finding that requires a bound, owned acknowledgment before a deadline -- and a real consequence if nobody answers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["escalation_contract*"]
