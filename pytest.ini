[pytest]
testpaths = tests
python_files = test_*.py

markers =
    # ── Speed / isolation ────────────────────────────────────────────────────
    # Applied additively. Nothing is enforced yet -- see the note at the bottom.
    local: runs fully in-process, no network and no live service
    unit: narrow scope, a single module or class in isolation
    slow: takes more than a few seconds

    # ── Opt-in: skipped unless the matching flag is passed ───────────────────
    live: requires a live service (Redis, a running API). Use --run-live.

    # ── Existing suite markers ───────────────────────────────────────────────
    smoke: fast environment and launcher checks
    integration: tranche-focused cross-plane integration checks
    regression: legacy core behavior regression checks
    e2e: realistic full-stack workflow checks
    ui: dashboard surface verification

filterwarnings =
    ignore::DeprecationWarning
    # Turns a typo'd or undeclared marker into a collection error rather than
    # a silently-ignored no-op, so every marker used must be declared above.
    # (`--strict-markers` is the usual way to get this, but under pytest 9 it
    # only takes effect from the command line -- via addopts it is applied too
    # late to affect marker validation. This form works from the ini file.)
    error::pytest.PytestUnknownMarkWarning

# NOTE: CAGE enforces a stricter contract -- every test MUST carry one
# selection marker, checked in a collection hook. That is worth adopting, but
# it is a migration across the whole suite rather than a config change, so it
# is deliberately not enforced here yet.
