[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arto-reachability"
version = "0.1.0"
description = "Static reachability scanner: flags safety-critical functions with no caller path from real entry points."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arto-reachability = "arto_reachability.cli:main"

[tool.setuptools.packages.find]
include = ["arto_reachability*"]
