[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-metrics"
version = "0.1.0"
description = "Turn-over-turn decay-delta scoring for detecting escalation across a conversation, not just within a single turn."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["trajectory_metrics*"]
